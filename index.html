<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rutyny</title>
<meta name="theme-color" content="#FAF6EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1D1B22" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}

/* Layout: one column, phone-first; home = one big "now" card + quiet list; focus = one step, one main button */
:root{
  --bg:#FAF6EF; --card:#FFFFFF; --ink:#2E2A26; --muted:#7A7064; --line:#EFE6D8;
  --sun:#F6B73C; --sun-soft:#FDEBC4; --sun-ink:#3A2A08;
  --peach:#F4B79A; --peach-soft:#FCE3D6;
  --lav:#B9A9EE; --lav-soft:#E9E3FB;
  --face:#2E2A26; --cheek:#F08A76;
  --display:"Fredoka","Nunito",ui-rounded,system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1D1B22; --card:#28252E; --ink:#F3EEE7; --muted:#ABA3B4; --line:#37333E;
  --sun:#F6B73C; --sun-soft:#3E331E; --sun-ink:#2A1E05;
  --peach:#E8A487; --peach-soft:#3F2E29; --lav:#A795E6; --lav-soft:#332D45;
  --face:#2A2530; --cheek:#E77F6B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1D1B22; --card:#28252E; --ink:#F3EEE7; --muted:#ABA3B4; --line:#37333E;
  --sun:#F6B73C; --sun-soft:#3E331E; --sun-ink:#2A1E05;
  --peach:#E8A487; --peach-soft:#3F2E29; --lav:#A795E6; --lav-soft:#332D45;
  --face:#2A2530; --cheek:#E77F6B; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:460px;margin:0 auto;padding-block:18px 40px;min-height:100%;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}
.muted{color:var(--muted)}
/* home */
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.date{color:var(--muted);font-weight:700;font-size:14px}
.hello{font-size:30px;margin-top:6px}
.lead{color:var(--muted);margin:4px 0 18px}
.now{border-radius:28px;padding:22px 20px 20px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.now.sun{background:var(--sun-soft)} .now.peach{background:var(--peach-soft)} .now.lav{background:var(--lav-soft)}
.now .row{display:flex;gap:14px;align-items:center}
.now .eyebrow{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.now h2{font-size:28px}
.now .mascot{width:96px;height:96px;flex:none}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border-radius:999px;font-weight:800;font-size:18px}
.btn.primary{background:var(--sun);color:var(--sun-ink)}
.btn.primary:active{transform:scale(.98)}
.btn.soft{background:var(--card);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--muted);min-height:44px;font-size:15px}
.resume{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:20px;padding:12px 12px 12px 16px;margin-bottom:14px}
.resume b{flex:1;min-width:0}
.resume button{background:var(--sun);color:var(--sun-ink);font-weight:800;border-radius:999px;padding:8px 16px}
.section{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:26px 4px 10px}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:22px;padding:10px 10px 10px 12px}
.item .go{flex:1;display:flex;align-items:center;gap:12px;text-align:left;min-width:0}
.item .mascot{width:52px;height:52px;flex:none}
.item h3{font-size:18px}
.item small{color:var(--muted);font-size:14px;display:block}
.icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--bg)}
.note{margin-top:22px;font-size:14px;color:var(--muted);background:var(--card);border-radius:20px;padding:14px 16px}
.note summary{font-weight:800;color:var(--ink);cursor:pointer}
.note code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--bg);padding:1px 6px;border-radius:6px}
/* focus */
.fbar{display:flex;align-items:center;gap:12px}
.track{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .4s}
.chip{font-size:13px;font-weight:800;border-radius:999px;padding:7px 12px;background:var(--card);color:var(--muted)}
.chip.on{background:var(--sun);color:var(--sun-ink)}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;padding-block:20px}
.step{background:var(--card);border-radius:32px;padding:30px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;min-height:300px;justify-content:center}
.step .mascot{width:84px;height:84px}
.step h2{font-size:30px;line-height:1.15}
.step p{margin:0;color:var(--muted);max-width:30ch}
.mins{font-size:14px;font-weight:700;color:var(--muted)}
.timer{display:flex;flex-direction:column;align-items:center;gap:8px}
.timer svg{width:120px;height:120px}
.timer .t{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.timer button{font-weight:800;border-radius:999px;padding:8px 18px;background:var(--bg)}
.actions{display:flex;flex-direction:column;gap:10px}
.actions .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions .pair .btn{min-height:50px;font-size:16px}
/* done */
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px}
.done .mascot{width:140px;height:140px}
.done h1{font-size:44px}
/* sheet */
.veil{position:fixed;inset:0;background:rgba(20,16,12,.35);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:480px;border-radius:28px 28px 0 0;padding:22px max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.sheet h3{font-size:22px} .sheet p{margin:0 0 6px;color:var(--muted)}
/* edit */
.ehead{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.ehead input{flex:1;min-width:0;font-family:var(--display);font-size:24px;font-weight:600;background:transparent;border:0;color:var(--ink);padding:6px}
.erow{background:var(--card);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px}
.erow input[type=text]{width:100%;box-sizing:border-box;font:inherit;font-weight:700;border:0;background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 12px}
.erow .ctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.erow label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);font-weight:700}
.erow input[type=number]{width:56px;font:inherit;border:0;background:var(--bg);color:var(--ink);border-radius:10px;padding:6px 8px}
.erow .sp{flex:1}
.erow .icon-btn{width:38px;height:38px}
.danger{color:#C2483B}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.now .mascot,.step .mascot{animation:bob 4s ease-in-out infinite}
:root{--mint:#8FCFB0;--mint-soft:#DDF1E6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--mint:#7CC0A0;--mint-soft:#24382F}}
:root[data-theme="dark"]{--mint:#7CC0A0;--mint-soft:#24382F}
.now.mint{background:var(--mint-soft)}
.top .icon-btn{margin-right:-8px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.qbtn{background:var(--card);border-radius:22px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:88px}
.qbtn b{font-family:var(--display);font-weight:600;font-size:18px}
.qbtn small{color:var(--muted);font-size:13px;line-height:1.3}
.add{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--line);border-radius:22px;min-height:56px;color:var(--muted);font-weight:800}
.tmin{font-size:13px;font-weight:800;color:var(--muted);background:var(--bg);border-radius:999px;padding:4px 10px;flex:none}
/* forms */
.page h1{font-size:28px}
.page{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.in{width:100%;font:inherit;font-weight:700;border:0;background:var(--card);color:var(--ink);border-radius:16px;padding:14px 16px}
textarea.in{min-height:70px;resize:vertical;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font-weight:800;border-radius:999px;padding:9px 14px;background:var(--card);color:var(--ink)}
.chips button.on{background:var(--sun);color:var(--sun-ink)}
.msg{background:var(--card);border-radius:18px;padding:14px 16px;color:var(--muted);font-size:15px}
.msg.err{color:#C2483B}
.msg a{color:inherit;font-weight:800}
.plan{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:16px;padding:6px 6px 6px 12px}
.prow input.t{flex:1;min-width:0;font:inherit;font-weight:700;border:0;background:transparent;color:var(--ink);padding:8px 0}
.prow input.m{width:52px;font:inherit;border:0;background:var(--bg);color:var(--ink);border-radius:10px;padding:6px;text-align:center}
.prow .icon-btn{width:36px;height:36px}
.sum{display:flex;justify-content:space-between;color:var(--muted);font-weight:700;font-size:14px;padding:0 4px}
.row2{display:flex;gap:8px}.row2 .in{flex:1;min-width:0}.row2 .btn{width:auto;padding:0 18px;min-height:50px;font-size:16px}
.spin{display:inline-block;width:18px;height:18px;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border-radius:18px;padding:14px 16px;font-weight:700}
.switch input{width:22px;height:22px;accent-color:var(--sun)}
.kinds{display:flex;gap:8px}
.kinds button{width:56px;height:56px;border-radius:16px;background:var(--card);display:grid;place-items:center;border:3px solid transparent}
.kinds button.on{border-color:var(--sun)}
.kinds .mascot{width:40px;height:40px}
/* focus, Neurolist-like */
.prev{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;margin-top:14px;min-height:28px}
.prev s{color:var(--ink);opacity:.7}
.prev span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prev button{font-weight:800;color:var(--muted);font-size:14px}
.step .now-row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.clock{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;color:var(--ink)}
.clock.over{color:var(--muted)}
.sbar{width:100%;max-width:260px;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.sbar i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .5s linear}
.nextc{background:var(--card);border-radius:20px;padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.nextc small{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.nextc b{font-weight:700}
.eta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;font-weight:700;padding:0 6px}
.eta b{color:var(--ink);font-variant-numeric:tabular-nums}
.stage{justify-content:flex-start;padding-block:10px 0;gap:14px}
.step{min-height:240px}
</style>
</head>
<body>

<div id="app"></div>

<script>
const LS='moje-rutyny-v2', LSS='moje-rutyny-sesja-v2', LSK='rutyny-gemini-key';
const DEFAULT={routines:[
 {id:'rano',name:'Poranek',sub:'Po budziku, pn–pt',kind:'sun',steps:[
  ['Leki i łyk wody','Jeszcze w łóżku.',1,1],
  ['Wstać i otworzyć okno','',1,1],
  ['Łazienka: toaleta, twarz','',5,1],
  ['Zmywarkę opróżnić','',5,0],
  ['Zrobić ciepłe śniadanie','',10,1],
  ['Zjeść na spokojnie','',15,1],
  ['Zęby umyć','',3,1],
  ['Królikom siano i woda','',3,1],
  ['Ubrać się','Ubrania leżą od wieczora.',8,1],
  ['Łóżko i rzeczy z nocy na miejsce','Jak w namiocie: tylko to, co widać.',5,0],
  ['Torba: pudełko z lodówki, klucze, bilet','',3,1],
  ['Kurtka, buty i wychodzę','',2,1]]},
 {id:'powrot',name:'Powrót do domu',sub:'Po szkole, gdy złapie WiFi',kind:'peach',steps:[
  ['Buty i kurtka na swoje miejsce','',2,1],
  ['Pudełko z torby do zmywarki','',2,1],
  ['Ręce umyć, przebrać się w domowe','',5,1],
  ['Woda i coś małego do jedzenia','',5,1],
  ['Przerwa dla siebie','Leżeć, serial, druty. Timer przypomni o końcu.',30,1,30],
  ['Rzut oka na wieczór','Co dziś: gotowanie, siłownia, terapia?',2,1],
  ['Jedna rzecz z Putzplanu','Tylko jedna. Reszta może poczekać.',10,0]]},
 {id:'wieczor',name:'Wieczór',sub:'1,5 h przed snem',kind:'lav',steps:[
  ['Rzut oka na jutro','Szkoła, terminy, co chcę zjeść.',3,0],
  ['Jedzenie na jutro do pudełka','',5,0],
  ['Torba na jutro przy drzwiach','',5,1],
  ['Ubrania na jutro wyłożyć','',3,0],
  ['Coś ciepłego do picia','Herbata, kakao.',5,0],
  ['Prysznic, zęby, piżama','',15,1],
  ['Pielęgnacja: twarz, krem','',5,0],
  ['Telefon na ładowarkę','',1,1],
  ['Czas dla siebie','Druty, szydełko, książka. Timer przypomni o spaniu.',20,0,20],
  ['Do łóżka','',1,1]]}
]};
const uid=p=>(p||'x')+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function norm(d){d.routines.forEach(r=>{r.steps=r.steps.map((s,i)=>Array.isArray(s)?{id:r.id+'-'+i+'-'+Math.random().toString(36).slice(2,6),t:s[0],h:s[1],min:s[2],core:!!s[3],timer:s[4]||0}:s)});return d}
const clone=o=>JSON.parse(JSON.stringify(o));
function migrate(v){
  if(!(v.mig>=1)){const r=v.routines.find(x=>x.id==='rano');if(r)r.steps=r.steps.filter(st=>!(st.timer>0&&/łóżk/i.test(st.t||'')));v.mig=1}
  if(!(v.mig>=2)){v.tasks=v.tasks||[];v.settings=Object.assign({sound:true},v.settings||{});v.mig=2}
  return v}
function load(){try{const v=JSON.parse(localStorage.getItem(LS));if(v&&v.routines){const m=migrate(v);try{localStorage.setItem(LS,JSON.stringify(m))}catch(e){}return m}}catch(e){}const d=migrate(norm(clone(DEFAULT)));d.mig=2;return d}
function save(){try{localStorage.setItem(LS,JSON.stringify(data))}catch(e){}}
function loadS(){try{return JSON.parse(localStorage.getItem(LSS))}catch(e){return null}}
function saveS(){try{session?localStorage.setItem(LSS,JSON.stringify(session)):localStorage.removeItem(LSS)}catch(e){}}
function getKey(){try{return localStorage.getItem(LSK)||''}catch(e){return ''}}
function setKey(k){try{k?localStorage.setItem(LSK,k):localStorage.removeItem(LSK)}catch(e){}}

let data=load(), session=loadS(), view='home', editId=null, sheet=null, tick=null, wake=null;
let draft=null; /* {mode:'break'|'time', name, min, note, steps:[], busy, err, taskId} */
let lastDone=null; /* {name, kind, taskId} */
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=id=>data.routines.find(r=>r.id===id);
const T=id=>data.tasks.find(t=>t.id===id);
const KINDS=['sun','peach','lav','mint'];

/* mascots: simple shapes, friendly faces */
function face(mood,cx,cy,s){
  const f='var(--face)';
  const eyes = mood==='sleep'||mood==='calm'
    ? `<path d="M${cx-14*s} ${cy} q${5*s} ${5*s} ${10*s} 0 M${cx+4*s} ${cy} q${5*s} ${5*s} ${10*s} 0" stroke="${f}" stroke-width="${2.6*s}" fill="none" stroke-linecap="round"/>`
    : `<ellipse cx="${cx-9*s}" cy="${cy}" rx="${3*s}" ry="${4*s}" fill="${f}"/><ellipse cx="${cx+9*s}" cy="${cy}" rx="${3*s}" ry="${4*s}" fill="${f}"/>`;
  return eyes+`<path d="M${cx-6*s} ${cy+10*s} q${6*s} ${6*s} ${12*s} 0" stroke="${f}" stroke-width="${2.6*s}" fill="none" stroke-linecap="round"/>
  <circle cx="${cx-18*s}" cy="${cy+8*s}" r="${3.5*s}" fill="var(--cheek)" opacity=".55"/><circle cx="${cx+18*s}" cy="${cy+8*s}" r="${3.5*s}" fill="var(--cheek)" opacity=".55"/>`;
}
function mascot(kind,mood){
  let body='';
  if(kind==='sun'){let rays='';for(let i=0;i<8;i++){const a=i*Math.PI/4,x1=50+Math.cos(a)*36,y1=52+Math.sin(a)*36,x2=50+Math.cos(a)*45,y2=52+Math.sin(a)*45;rays+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--sun)" stroke-width="5" stroke-linecap="round"/>`}
    body=rays+`<circle cx="50" cy="52" r="29" fill="var(--sun)"/>`+face(mood||'happy',50,50,1);}
  else if(kind==='peach'){body=`<path d="M50 14 L84 42 Q88 46 88 52 L88 78 Q88 88 78 88 L22 88 Q12 88 12 78 L12 52 Q12 46 16 42 Z" fill="var(--peach)" stroke="var(--peach)" stroke-width="6" stroke-linejoin="round"/>`+face(mood||'happy',50,58,1);}
  else if(kind==='mint'){body=`<path d="M50 12 C72 12 90 30 88 54 C86 76 70 90 50 90 C28 90 12 76 12 54 C12 30 28 12 50 12Z" fill="var(--mint)"/><path d="M50 12 q8 -8 16 -4 q-6 8 -16 4z" fill="var(--mint)"/>`+face(mood||'happy',50,54,1);}
  else {body=`<circle cx="50" cy="54" r="32" fill="var(--lav)"/><path d="M78 16 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5z" fill="var(--sun)"/>`+face(mood||'sleep',50,52,1);}
  return `<svg class="mascot" viewBox="0 0 100 100" aria-hidden="true">${body}</svg>`;
}
const ICON={
 edit:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
 x:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
 back:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',

/* ---------- AI (Gemini) ---------- */
const AI_RULES=`Jesteś asystentem Agaty, która ma ADHD. Piszesz po polsku.
Zasady dla kroków:
- Każdy krok to jedna konkretna czynność fizyczna, zaczyna się od czasownika, max 7 słów.
- Zero decyzji w kroku: zamiast "uporządkuj papiery" napisz np. "Wszystkie papiery z biurka na jedną kupkę".
- Pierwszy krok bardzo mały i łatwy (1–2 min), żeby łatwo zacząć.
- Kroki 1–10 minut. Każdy kończy się widocznym efektem.
- Bez "i/lub", bez "jeśli chcesz", bez nagród i bez motywacyjnych tekstów.
- Ostatni krok krótko domyka (np. "Odłożyć worek na śmieci przy drzwi").
- Suma minut nie może przekroczyć dostępnego czasu.
- Maksymalnie 10 kroków.
Odpowiadasz TYLKO JSON-em w formacie: {"steps":[{"t":"tekst kroku","min":3,"h":"krótka podpowiedź albo pusty tekst"}]}`;
async function aiJSON(prompt){
  const key=getKey(); if(!key)throw new Error('NOKEY');
  const models=['gemini-flash-latest','gemini-2.5-flash','gemini-2.0-flash'];
  let last='';
  for(const m of models){
    let res;
    try{res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},
      body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{responseMimeType:'application/json',temperature:0.6}})});}
    catch(e){throw new Error('NET')}
    if(res.status===404){last='404';continue}
    if(res.status===400||res.status===401||res.status===403)throw new Error('BADKEY');
    if(res.status===429)throw new Error('LIMIT');
    if(!res.ok){last=String(res.status);continue}
    const j=await res.json();
    const txt=(((j.candidates||[])[0]||{}).content||{}).parts?.map(p=>p.text||'').join('')||'';
    const clean=txt.replace(/^```(json)?/,'').replace(/```$/,'').trim();
    const out=JSON.parse(clean);
    if(!out||!Array.isArray(out.steps))throw new Error('FORMAT');
    return out.steps.filter(s=>s&&s.t).slice(0,12).map(s=>({id:uid('t'),t:String(s.t).slice(0,80),min:Math.max(1,Math.min(60,Math.round(+s.min||3))),h:String(s.h||'').slice(0,120)}));
  }
  throw new Error('HTTP '+last);
}
function aiErr(e){const m=e&&e.message;
  if(m==='NOKEY')return 'Najpierw wklej klucz Google w ustawieniach (zębatka u góry).';
  if(m==='BADKEY')return 'Klucz Google nie działa. Sprawdź go w ustawieniach.';
  if(m==='LIMIT')return 'Darmowy limit AI na teraz się skończył. Spróbuj za kilka minut.';
  if(m==='NET')return 'Brak internetu albo AI nie odpowiada. Spróbuj jeszcze raz.';
  return 'AI odpowiedziało dziwnie. Spróbuj jeszcze raz.';}
async function runBreak(change){
  const d=draft; if(!d.name.trim()){d.err='Wpisz, co chcesz zrobić.';render();return}
  d.busy=true;d.err='';render();
  let p=AI_RULES+`\n\nZadanie: "${d.name.trim()}". Dostępny czas: ${d.min} minut.`;
  if(d.note.trim())p+=`\nDodatkowo: ${d.note.trim()}`;
  if(change&&d.steps.length)p+=`\n\nObecne kroki: ${JSON.stringify(d.steps.map(s=>({t:s.t,min:s.min})))}\nZmień je tak: ${change}`;
  else p+=`\nRozbij to zadanie na kroki.`;
  try{d.steps=await aiJSON(p);d.change=''}catch(e){d.err=aiErr(e)}
  d.busy=false;render();
}
function pool(){
  const items=[];
  data.tasks.forEach(t=>items.push({src:'zadanie',name:t.t,min:t.min||totalMin(t.steps||[])||10,taskId:t.id}));
  data.routines.forEach(r=>r.steps.forEach(s=>items.push({src:r.name,name:s.t,min:s.min||3})));
  return items;
}
function localPick(min){
  const tasks=data.tasks.map(t=>({t:t.t,min:t.min||totalMin(t.steps||[])||10})).filter(t=>t.min<=min).sort((a,b)=>a.min-b.min);
  const out=[];let sum=0;for(const t of tasks){if(sum+t.min<=min){out.push({id:uid('t'),t:t.t,min:t.min,h:''});sum+=t.min}}
  return out;
}
async function runTime(change){
  const d=draft; d.busy=true;d.err='';render();
  const items=pool();
  let p=AI_RULES+`\n\nAgata ma ${d.min} minut.`+(d.note.trim()?` Sytuacja/ochota: ${d.note.trim()}.`:'')+`
Wybierz z listy poniżej to, co ma sens teraz i zmieści się w czasie. Najpierw zadania z listy "zadanie", potem pasujące kroki z rutyn. Dużą rzecz możesz rozbić na mniejsze kroki albo wziąć z niej tylko kawałek (np. "Papiery: tylko jedna szuflada").
Lista: ${JSON.stringify(items.slice(0,120).map(i=>({skąd:i.src,co:i.name,min:i.min})))}`;
  if(change&&d.steps.length)p+=`\n\nObecny plan: ${JSON.stringify(d.steps.map(s=>({t:s.t,min:s.min})))}\nZmień go tak: ${change}`;
  try{d.steps=await aiJSON(p);d.change=''}
  catch(e){
    if(e.message==='NOKEY'){d.steps=localPick(d.min);d.err=d.steps.length?'Bez klucza AI wybrałam po prostu zadania z listy, które się zmieszczą.':'Bez klucza AI potrzebuję zadań na liście. Dodaj je na stronie głównej albo wklej klucz w ustawieniach.'}
    else d.err=aiErr(e);
  }
  d.busy=false;render();
}

function vDone(){const r=lastDone||{name:'',kind:'sun'};
  const t=r.taskId&&T(r.taskId);
  return `<div class="done">${mascot(r.kind,'calm')}<h1>Fertig.</h1><p class="muted">${esc(r.name)}</p>
   ${t?`<button class="btn primary" data-a="tdone" style="max-width:300px">Zadanie zrobione, usuń z listy</button>`:''}
   <button class="btn soft" data-a="home" style="max-width:300px">Wróć</button></div>`}
function vEdit(){const r=R(editId);
  return `<div class="ehead"><button class="icon-btn" data-a="home" aria-label="Wróć">${ICON.back}</button><input id="rname" type="text" value="${esc(r.name)}" aria-label="Nazwa rutyny"></div>
  <div class="field" style="margin-bottom:12px"><span>Kolor i ludzik</span><div class="kinds">${KINDS.map(k=>`<button data-a="kind" data-k="${k}" class="${r.kind===k?'on':''}" aria-label="${k}">${mascot(k)}</button>`).join('')}</div></div>
  <div class="list">${r.steps.map((s,i)=>`<div class="erow">
    <input type="text" id="t-${s.id}" data-f="t" data-i="${i}" value="${esc(s.t)}" aria-label="Krok ${i+1}">
    <input type="text" id="h-${s.id}" data-f="h" data-i="${i}" value="${esc(s.h)}" placeholder="Podpowiedź (opcjonalnie)" style="font-weight:400" aria-label="Podpowiedź">
    <div class="ctl"><label>min <input type="number" id="m-${s.id}" data-f="min" data-i="${i}" min="0" max="120" value="${s.min||0}"></label>
    <label><input type="checkbox" id="c-${s.id}" data-f="core" data-i="${i}" ${s.core?'checked':''}> ważne</label>
    <label><input type="checkbox" id="x-${s.id}" data-f="timer" data-i="${i}" ${s.timer?'checked':''}> timer</label>
    <span class="sp"></span>
    <button class="icon-btn" data-a="mv" data-i="${i}" data-d="-1" aria-label="W górę">${ICON.up}</button>
    <button class="icon-btn" data-a="mv" data-i="${i}" data-d="1" aria-label="W dół">${ICON.down}</button>
    <button class="icon-btn danger" data-a="del" data-i="${i}" aria-label="Usuń">${ICON.del}</button></div></div>`).join('')}</div>
  <div class="actions" style="margin-top:14px"><button class="btn primary" data-a="add">Dodaj krok</button>
  ${['rano','powrot','wieczor'].includes(r.id)?`<button class="btn ghost" data-a="reset">Przywróć domyślną listę</button>`:`<button class="btn ghost danger" data-a="rdel">Usuń rutynę</button>`}</div>
  <p class="muted" style="font-size:14px">„Ważne” = zostaje w trybie „Minimum”.</p>`;
}
function vSheet(){
  if(sheet==='exit')return `<div class="veil" data-a="close"><div class="sheet" role="dialog" aria-label="Zakończyć?"><h3>Zakończyć?</h3><p>To, co zrobione, zostaje zrobione.</p>
   <button class="btn primary" data-a="exitok">Zakończ</button><button class="btn ghost" data-a="close">Wróć</button></div></div>`;
  if(sheet==='reset')return `<div class="veil" data-a="close"><div class="sheet" role="dialog"><h3>Przywrócić domyślną listę?</h3><p>Twoje zmiany w tej rutynie znikną.</p>
   <button class="btn primary" data-a="resetok">Przywróć</button><button class="btn ghost" data-a="close">Anuluj</button></div></div>`;
  if(sheet==='rdel')return `<div class="veil" data-a="close"><div class="sheet" role="dialog"><h3>Usunąć tę rutynę?</h3><p>Tego nie da się cofnąć.</p>
   <button class="btn primary" data-a="rdelok">Usuń</button><button class="btn ghost" data-a="close">Anuluj</button></div></div>`;
  return '';
}
function render(){
  clearInterval(tick);tick=null;
  try{app.innerHTML=(view==='focus'&&session?vFocus():view==='done'?vDone():view==='edit'&&editId&&R(editId)?vEdit():view==='draft'&&draft?vDraft():view==='settings'?vSettings():vHome())+(typeof sheet==='string'?vSheet():'');}
  catch(err){console.error(err);session=null;saveS();view='home';editId=null;sheet=null;draft=null;app.innerHTML=vHome();}
  if(view==='focus'&&session){tick=setInterval(updTimer,500);updTimer()}
  view==='focus'?lock():unlock();
}
async function lock(){try{if(!wake&&navigator.wakeLock)wake=await navigator.wakeLock.request('screen')}catch(e){}}
function unlock(){try{wake&&wake.release()}catch(e){}wake=null}

/* ---------- timers ---------- */
function updTimer(){
  if(!session)return;
  const r=srcOf(); if(!r)return;
  const step=r.steps.find(s=>s.id===session.queue[0]);
  // calm step clock (no alarm)
  const sc=document.getElementById('sc'), sb=document.getElementById('sb');
  if(sc&&step){const full=(+step.min||1)*60000, el=Date.now()-(session.stepStart||Date.now()), left=full-el;
    const a=Math.abs(left), m=Math.floor(a/60000), s=Math.floor(a%60000/1000);
    sc.textContent=(left>=0?'':'+')+`${m}:${String(s).padStart(2,'0')}`; sc.classList.toggle('over',left<0);
    if(sb)sb.style.width=Math.min(100,el/full*100).toFixed(1)+'%';}
  const eta=document.getElementById('eta');
  if(eta&&step){const remain=session.queue.map(id=>r.steps.find(s=>s.id===id)).reduce((a,s)=>a+(+(s&&s.min)||0),0);
    const used=Math.min(Date.now()-(session.stepStart||Date.now()),(+step.min||0)*60000);
    eta.textContent=hhmm(new Date(Date.now()+remain*60000-used));}
  // real timer
  const t=session.timer, el=document.getElementById('tt'), ring=document.getElementById('ring'); if(!t||!el)return;
  const st=r.steps.find(s=>s.id===t.id); if(!st)return; const full=st.timer*60000;
  const left=Math.max(0,t.paused!=null?t.paused:t.end-Date.now());
  const m=Math.floor(left/60000), s=Math.floor(left%60000/1000);
  el.textContent=left>0?`${m}:${String(s).padStart(2,'0')}`:'Już!';
  ring.setAttribute('stroke-dashoffset',(326.7*(1-left/full)).toFixed(1));
  if(left<=0)timerDone();
}
let endTO=null;
function askNotify(){try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission()}catch(e){}}
function notifyDone(st,r){
  try{navigator.vibrate&&navigator.vibrate([400,150,400,150,400])}catch(e){}
  sndAlarm();
  try{if('Notification' in window&&Notification.permission==='granted'&&navigator.serviceWorker){
    navigator.serviceWorker.ready.then(reg=>reg.showNotification('Czas minął ⏰',{body:st.t+' · '+r.name+'. Możesz iść dalej.',tag:'rutyny-timer',renotify:true,requireInteraction:true,vibrate:[400,150,400,150,400],icon:'icon-192.png',badge:'icon-192.png',data:{url:'./'}}))}}catch(e){}
}
function timerDone(){
  const t=session&&session.timer; if(!t||t.paused!=null||t.rang)return;
  if(Date.now()<t.end){scheduleEnd();return}
  const r=srcOf(), st=r&&r.steps.find(s=>s.id===t.id); if(!st)return;
  t.rang=1;saveS();notifyDone(st,r);
}
function scheduleEnd(){clearTimeout(endTO);const t=session&&session.timer;if(t&&t.paused==null&&!t.rang)endTO=setTimeout(timerDone,Math.max(0,t.end-Date.now())+150)}
setInterval(timerDone,5000);

/* ---------- events ---------- */
function newDraft(mode,extra){draft=Object.assign({mode,name:'',min:mode==='time'?15:30,note:'',steps:[],busy:false,err:'',change:'',taskId:null},extra||{});view='draft';render();window.scrollTo(0,0)}
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b)return;
  const a=b.dataset.a;
  if(a==='close'&&b.classList.contains('veil')&&e.target!==b)return;
  if(b.tagName==='A')e.preventDefault();
  const r=editId&&R(editId);
  switch(a){
   case 'start':start(b.dataset.id,false);break;
   case 'startmin':start(b.dataset.id,true);break;
   case 'resume':view='focus';render();break;
   case 'home':view='home';editId=null;draft=null;sheet=null;render();window.scrollTo(0,0);break;
   case 'settings':view='settings';sheet=null;render();window.scrollTo(0,0);break;
   case 'edit':editId=b.dataset.id;view='edit';render();window.scrollTo(0,0);break;
   case 'newr':{const k=KINDS[data.routines.length%KINDS.length];const nr={id:uid('r'),name:'Nowa rutyna',sub:'',kind:k,steps:[]};data.routines.push(nr);save();editId=nr.id;view='edit';render();
     setTimeout(()=>{const i=document.getElementById('rname');if(i){i.focus();i.select()}},30);break;}
   case 'kind':r.kind=b.dataset.k;save();render();break;
   case 'rdel':sheet='rdel';render();break;
   case 'rdelok':data.routines=data.routines.filter(x=>x.id!==editId);if(session&&session.rid===editId){session=null;saveS()}save();sheet=null;editId=null;view='home';render();break;
   case 'time':newDraft('time');break;
   case 'break':newDraft('break');setTimeout(()=>{const i=document.getElementById('d-name');if(i)i.focus()},30);break;
   case 'task':{const t=T(b.dataset.id);if(!t)return;if(t.steps&&t.steps.length)startTemp(t.t,'mint',clone(t.steps),t.id);else newDraft('break',{name:t.t,min:t.min||30,taskId:t.id});break;}
   case 'tedit':{const t=T(b.dataset.id);if(!t)return;newDraft('break',{name:t.t,min:t.min||30,steps:clone(t.steps||[]),taskId:t.id});break;}
   case 'dmin':draft.min=+b.dataset.m;render();break;
   case 'dbreak':runBreak();break;
   case 'dbreakc':runBreak((draft.change||'').trim()||'bardziej szczegółowo');break;
   case 'dtime':runTime();break;
   case 'dtimec':runTime((draft.change||'').trim()||'inny wybór');break;
   case 'ddel':draft.steps.splice(+b.dataset.i,1);render();break;
   case 'dadd':draft.steps.push({id:uid('t'),t:'',min:5,h:''});render();
     setTimeout(()=>{const ins=app.querySelectorAll('.prow input.t');const l=ins[ins.length-1];if(l)l.focus()},30);break;
   case 'dstart':{const nm=draft.mode==='time'?`${draft.min} minut`:(draft.name.trim()||'Zadanie');startTemp(nm,'mint',draft.steps,draft.taskId);draft=null;break;}
   case 'dsavet':{const steps=draft.steps.filter(s=>(s.t||'').trim());const nm=draft.mode==='time'?`Plan na ${draft.min} min`:(draft.name.trim()||'Zadanie');
     if(draft.taskId&&T(draft.taskId)){Object.assign(T(draft.taskId),{t:nm,min:totalMin(steps)||draft.min,steps})}
     else data.tasks.push({id:uid('k'),t:nm,min:totalMin(steps)||draft.min,steps});
     save();draft=null;view='home';render();break;}
   case 'dsaver':{const steps=draft.steps.filter(s=>(s.t||'').trim()).map(s=>({id:uid('s'),t:s.t.trim(),h:s.h||'',min:+s.min||5,core:true,timer:0}));
     const nr={id:uid('r'),name:draft.mode==='time'?`Plan na ${draft.min} min`:(draft.name.trim()||'Nowa rutyna'),sub:'',kind:KINDS[data.routines.length%KINDS.length],steps};
     data.routines.push(nr);save();draft=null;editId=nr.id;view='edit';render();window.scrollTo(0,0);break;}
   case 'tdelete':data.tasks=data.tasks.filter(t=>t.id!==draft.taskId);save();draft=null;view='home';render();break;
   case 'tdone':data.tasks=data.tasks.filter(t=>t.id!==lastDone.taskId);save();lastDone=null;view='home';render();break;
   case 'keysave':{const v=(document.getElementById('s-key').value||'').trim();setKey(v);sheet={msg:v?'Zapisane.':'Klucz usunięty.'};render();break;}
   case 'keytest':{const v=(document.getElementById('s-key').value||'').trim();setKey(v);sheet={msg:'Sprawdzam…'};render();
     aiJSON('Odpowiedz JSON-em {"steps":[{"t":"Test działa","min":1,"h":""}]}').then(()=>{sheet={msg:'Działa! AI jest gotowe.'};render()}).catch(err=>{sheet={msg:aiErr(err),bad:true};render()});break;}
   case 'fertig':{const id=session.queue.shift();session.done=(session.done||[]).concat(id);sndStep();next();break;}
   case 'skip':{const id=session.queue.shift();session.done=(session.done||[]).concat(id);next();break;}
   case 'undo':{const id=(session.done||[]).pop();if(id){session.queue.unshift(id);session.timer=null;session.stepStart=Date.now();saveS();render()}break;}
   case 'later':if(session.queue.length>1){session.queue.push(session.queue.shift())}session.timer=null;session.stepStart=Date.now();saveS();render();break;
   case 'minimal':{const rr=srcOf();session.minimal=!session.minimal;
     if(session.minimal){const core=new Set(rr.steps.filter(s=>s.core).map(s=>s.id));const before=session.queue.length;session.queue=session.queue.filter(id=>core.has(id));session.total-=before-session.queue.length;if(!session.queue.length){finishSession();return}}
     else{const done=session.total-session.queue.length;const noncore=rr.steps.filter(s=>!s.core&&!session.queue.includes(s.id)&&!(session.done||[]).includes(s.id)).map(s=>s.id);session.queue=session.queue.concat(noncore);session.total=done+session.queue.length}
     saveS();render();break;}
   case 'timer':{const st=srcOf().steps.find(s=>s.id===session.queue[0]);const t=session.timer;
     initSound();askNotify();
     if(!t||t.id!==st.id)session.timer={id:st.id,end:Date.now()+st.timer*60000,paused:null};
     else if(t.paused!=null){t.end=Date.now()+t.paused;t.paused=null}
     else{t.paused=Math.max(0,t.end-Date.now())}
     saveS();scheduleEnd();render();break;}
   case 'exit':sheet='exit';render();break;
   case 'exitok':sheet=null;session=null;saveS();view='home';render();break;
   case 'close':sheet=null;render();break;
   case 'mv':{const i=+b.dataset.i,j=i+ +b.dataset.d;if(j<0||j>=r.steps.length)return;[r.steps[i],r.steps[j]]=[r.steps[j],r.steps[i]];save();render();break;}
   case 'del':r.steps.splice(+b.dataset.i,1);save();render();break;
   case 'add':r.steps.push({id:r.id+'-n'+Date.now().toString(36),t:'Nowy krok',h:'',min:5,core:true,timer:0});save();render();
     setTimeout(()=>{const ins=app.querySelectorAll('.erow input[data-f="t"]');const l=ins[ins.length-1];if(l){l.focus();l.select()}},30);break;
   case 'reset':sheet='reset';render();break;
   case 'resetok':{const def=norm(clone(DEFAULT)).routines.find(x=>x.id===editId);if(def){Object.assign(r,def)}sheet=null;save();render();break;}
  }
});
app.addEventListener('input',e=>{
  const el=e.target;
  if(view==='draft'&&draft){
    if(el.id==='d-name'){draft.name=el.value;return}
    if(el.id==='d-note'){draft.note=el.value;return}
    if(el.id==='d-change'){draft.change=el.value;return}
    if(el.dataset.df){const s=draft.steps[+el.dataset.di];if(!s)return;if(el.dataset.df==='min')s.min=Math.max(1,+el.value||1);else s.t=el.value;
      const sum=app.querySelector('.sum span:last-child');if(sum){const t=totalMin(draft.steps);sum.textContent=`razem ${t} min${t>draft.min?' · więcej niż '+draft.min:''}`}return}
    return;
  }
  if(view==='settings'&&el.id==='s-sound'){data.settings.sound=el.checked;save();if(el.checked)sndStep();return}
  const r=editId&&R(editId); if(!r)return;
  if(el.id==='rname'){r.name=el.value;save();return}
  const i=+el.dataset.i, f=el.dataset.f; if(!f)return; const s=r.steps[i];
  if(f==='core')s.core=el.checked; else if(f==='timer')s.timer=el.checked?(+s.min||5):0;
  else if(f==='min'){s.min=Math.max(0,+el.value||0);if(s.timer)s.timer=s.min||1}
  else s[f]=el.value;
  save();
});
app.addEventListener('change',e=>{if(view==='settings'&&e.target.id==='s-sound'){data.settings.sound=e.target.checked;save()}});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&view==='draft'&&draft){
  if(e.target.id==='d-name'){e.preventDefault();runBreak()}
  else if(e.target.id==='d-change'){e.preventDefault();draft.mode==='time'?runTime(draft.change||'inny wybór'):runBreak(draft.change||'bardziej szczegółowo')}}});
function fromHash(){let h=(location.hash||'').slice(1);try{const q=new URLSearchParams(location.search).get('r');if(q){h=q;history.replaceState(null,'',location.pathname)}}catch(e){}if(h&&R(h)){start(h,false);return true}return false}
window.addEventListener('hashchange',fromHash);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){timerDone();if(view==='focus'){wake=null;lock();render()}}});
scheduleEnd();
if(!fromHash()){render()}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
